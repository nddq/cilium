name: ACN Image CI Build

# Look for TODO and blocker throughout code
# TODO need to add variable within settings workflow. that is where env.* vars live



# Any change in triggers needs to be reflected in the concurrency group.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev/*
      - release/*
  push:
    branches:
    - dev/*
    - release/*

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read
  # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
  id-token: write
  ### ACN CHANGE ###
  # Required for gh cli to trigger other workflows
  actions: write


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  build-and-push-prs:
    timeout-minutes: 45
    name: Build and Push Images
    runs-on: [self-hosted, 1ES.Pool=acn-githubemu2-mariner2-amd64-pool]
    strategy:
      matrix:
        include:
          - name: cilium
            dockerfile: ./images/cilium/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: cilium-cli
            dockerfile: ./cilium-cli/Dockerfile
            platforms: linux/amd64
            require-dir: cilium-cli

          - name: operator-aws
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: operator-azure
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: operator-alibabacloud
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: operator-generic
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: hubble-relay
            dockerfile: ./images/hubble-relay/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: clustermesh-apiserver
            dockerfile: ./images/clustermesh-apiserver/Dockerfile
            platforms: linux/amd64,linux/arm64

          - name: docker-plugin
            dockerfile: ./images/cilium-docker-plugin/Dockerfile
            platforms: linux/amd64,linux/arm64

          # Add SDP image once in branch

    steps:
      - name: Checkout base or default branch (trusted)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ### ACN CHANGE ###
          # We want to always pull from the branch that queued this workflow when setting variables
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      # Currently only using directory, but could use Image name in the future
      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables-acn
        env:
          image: ${{ matrix.name }}
          directory: ${{ matrix.dockerfile }}

      - name: Copy scripts to trusted directory
        run: |
          mkdir -p ../cilium-base-branch
          cp -r .github/actions/set-runtime-image ../cilium-base-branch

      ### ACN CHANGE ###
      # Skipping disk cleanup as we are using self-hosted runners with large disk

      # - name: Check for disk usage and cleanup /mnt
      #   shell: bash
      #   run: |
      #     echo "# Disk usage"
      #     df -h
      #     echo "# Usage for /mnt"
      #     sudo du --human-readable \
      #           --threshold 50m \
      #           -- /mnt
      #     if compgen -G "/mnt/.*" > /dev/null; then
      #       echo "# Hidden files in /mnt:"
      #       sudo du --human-readable --threshold 50m -- /mnt/.* 2>/dev/null
      #     fi
      #     echo "# Removing all contents of /mnt except /mnt/swapfile"
      #     sudo find /mnt -mindepth 1 ! -path /mnt/swapfile -exec rm -rf {} + || true

      # - name: Setup docker volumes into /mnt
      #   # This allows us to make use of all available disk.
      #   shell: bash
      #   run: |
      #     sudo systemctl stop docker
      #     sudo mv /var/lib/docker/volumes /mnt/docker-volumes
      #     sudo ln -s /mnt/docker-volumes /var/lib/docker/volumes
      #     sudo systemctl start docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
        with:
          driver-opts: |
            image=mcr.microsoft.com/oss/moby/buildkit:0.11.6-2

      - name: Getting image tag
        id: tag
        run: |
          # Replace ${{ github.event.repository.default_branch }} locations with direct reference as pforks default is not correct. We need upstream/main

          if [ "${{ github.event.pull_request.head.sha }}" != "" ]; then
            sha=${{ github.event.pull_request.head.sha }}
          else
            sha=${{ github.sha }}
          fi
          echo sha=${sha} >> $GITHUB_OUTPUT

          tag=${sha}
          echo tag=${tag} >> $GITHUB_OUTPUT

          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            if [[ "${{ github.ref_name }}" == "upstream/main" ]]; then
              floating_tag=latest
            else
              floating_tag="${{ github.ref_name }}"
              # Remove slashes from branch names
              floating_tag=${floating_tag##*/}
            fi
            echo floating_tag=${floating_tag} >> $GITHUB_OUTPUT
          fi

          normal_tag="acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${tag}"
          race_tag="${normal_tag}-race"
          unstripped_tag="${normal_tag}-unstripped"

          if [ -n "${floating_tag}" ]; then
            floating_normal_tag="acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${floating_tag}"
            normal_tag="${normal_tag},${floating_normal_tag}"
          fi

          if [[ "${{ github.event_name }}" == 'merge_group' || "${{ github.event_name }}" == 'push' ]]; then
            # Don't build race and unstripped images for merge_group or push events.
            race_tag=""
            unstripped_tag=""
          fi

          echo normal_tag=${normal_tag} >> $GITHUB_OUTPUT
          echo race_tag=${race_tag} >> $GITHUB_OUTPUT
          echo unstripped_tag=${unstripped_tag} >> $GITHUB_OUTPUT

      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check for disk usage
        shell: bash
        run: |
          df -h

      - name: Copy runtime image tag from untrusted branch
        run: |
          cp -r .github/actions/set-runtime-image/runtime-image.txt ../cilium-base-branch/set-runtime-image/

      - name: Set runtime image environment variable
        uses: ./../cilium-base-branch/set-runtime-image
        with:
          repository: ${{ env.CILIUM_RUNTIME_IMAGE_PREFIX }}

      # Load Golang cache build from GitHub
      - name: Restore Golang cache build from GitHub
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: go-cache
        with:
          path: /tmp/.cache/go
          key: ${{ runner.os }}-go-${{ matrix.name }}-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.name }}-cache-

      - name: Check for disk usage
        shell: bash
        run: |
          df -h
          docker buildx du

      - name: Create cache directories if they don't exist
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p /tmp/.cache/go

      # Import GitHub's cache build to docker cache
      - name: Copy ${{ matrix.name }} Golang cache to docker cache
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          provenance: false
          context: /tmp/.cache/go
          file: ./images/cache/Dockerfile
          push: false
          platforms: linux/amd64
          target: import-cache
          build-args: |
            ${{ env.ALPINE_ARGS }}
            ${{ env.GO_ARGS }}

      - name: Check for disk usage
        shell: bash
        run: |
          df -h
          docker buildx du

      - name: Check build constraints
        id: check
        run: |
          if [[ -z "${{ matrix.require-dir }}" ]] ||
             [[ -d "${{ matrix.require-dir }}" ]]; then
            echo build="true" >> $GITHUB_OUTPUT
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          auth-type: IDENTITY
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: acr login
        run: |
          az acr login -n acnpublic.azurecr.io

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: CI Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci
        if: ${{ steps.check.outputs.build != '' }}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tag.outputs.normal_tag }}
          target: release
          build-args: |
            CILIUM_RUNTIME_IMAGE=${{ env.CILIUM_RUNTIME_IMAGE }}
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ env.ALPINE_ARGS }}
            ${{ env.GO_ARGS }}

      - name: CI race detection Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci_detect_race_condition
        if: ${{ steps.check.outputs.build != '' && steps.tag.outputs.race_tag != ''}}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.race_tag }}
          target: release
          build-args: |
            BASE_IMAGE=${{ env.CILIUM_RUNTIME_IMAGE }}
            CILIUM_RUNTIME_IMAGE=${{ env.CILIUM_RUNTIME_IMAGE }}
            MODIFIERS="LOCKDEBUG=1 RACE=1"
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ env.ALPINE_ARGS }}
            ${{ env.GO_ARGS }}

      - name: CI Unstripped Binaries Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci_unstripped
        if: ${{ steps.check.outputs.build != '' && steps.tag.outputs.unstripped_tag != ''}}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.unstripped_tag }}
          target: release
          build-args: |
            CILIUM_RUNTIME_IMAGE=${{ env.CILIUM_RUNTIME_IMAGE }}
            MODIFIERS="NOSTRIP=1"
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ env.ALPINE_ARGS }}
            ${{ env.GO_ARGS }}

      - name: Sign Container Images
        if: ${{ steps.check.outputs.build != '' }}
        run: |
          cosign sign -y acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci.outputs.digest }}
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            cosign sign -y acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            cosign sign -y acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_unstripped.outputs.digest }}
          fi

      - name: Generate SBOM
        if: ${{ matrix.name != 'cilium-cli' }}
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          artifact-name: sbom_ci_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          output-file: ./sbom_ci_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          image: acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}

      - name: Generate SBOM (race)
        if: ${{ matrix.name != 'cilium-cli' && steps.docker_build_ci_detect_race_condition.outcome != 'skipped' }}
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          artifact-name: sbom_ci_race_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          output-file: ./sbom_ci_race_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          image: acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-race

      - name: Generate SBOM (unstripped)
        if: ${{ matrix.name != 'cilium-cli' && steps.docker_build_ci_unstripped.outcome != 'skipped' }}
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          artifact-name: sbom_ci_unstripped_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          output-file: ./sbom_ci_unstripped_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json
          image: acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-unstripped

      - name: Attach SBOM attestation to container image
        if: ${{ matrix.name != 'cilium-cli' }}
        run: |
          cosign attest -y --predicate sbom_ci_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json --type spdxjson acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci.outputs.digest }}
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            cosign attest -y --predicate sbom_ci_race_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json --type spdxjson acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            cosign attest -y --predicate sbom_ci_unstripped_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx.json --type spdxjson acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_unstripped.outputs.digest }}
          fi

      - name: CI Image Releases digests
        shell: bash
        if: ${{ steps.check.outputs.build != '' }}
        run: |
          mkdir -p image-digest/
          # shellcheck disable=SC2078
          if [ ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'ft/') }} ]; then
            echo "acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.floating_tag }}@${{ steps.docker_build_ci.outputs.digest }}" > image-digest/${{ matrix.name }}.txt
          fi
          echo "acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_ci.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            echo "acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-race@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            echo "acnpublic.azurecr.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-unstripped@${{ steps.docker_build_ci_unstripped.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          fi

      # Upload artifact digests
      - name: Upload artifact digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.check.outputs.build != '' }}
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

      - name: Check for disk usage
        if: ${{ always() }}
        shell: bash
        run: |
          df -h

  image-digests:
    if: ${{ always() }}
    name: Display Digests
    runs-on: [self-hosted, 1ES.Pool=acn-githubemu2-mariner2-amd64-pool]
    needs: build-and-push-prs
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat

  ### ACN CHANGES ###
  trigger-tests:
    if: ${{ always() && needs.build-and-push-prs.result == 'success' }}
    name: Trigger Test Workflows
    runs-on: ubuntu-24.04
    needs: [build-and-push-prs, image-digests]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      - name: Get SHA and PR info for triggering
        id: trigger-info
        run: |
          if [ "${{ github.event.pull_request.head.sha }}" != "" ]; then
            sha=${{ github.event.pull_request.head.sha }}
            pr_number=${{ github.event.pull_request.number }}
            context_ref=${{ github.head_ref }}
          else
            sha=${{ github.sha }}
            pr_number=""
            context_ref=${{ github.ref }}
          fi
          echo sha=${sha} >> $GITHUB_OUTPUT
          echo pr_number=${pr_number} >> $GITHUB_OUTPUT
          echo context_ref=${context_ref} >> $GITHUB_OUTPUT

      - name: Trigger Smoke Test
        run: |
          gh workflow run tests-smoke.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Smoke Test with IPv6
        run: |
          gh workflow run tests-smoke-ipv6.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Conformance K8s Network Policies
        run: |
          gh workflow run conformance-k8s-network-policies.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger K8s Network E2E tests and kube-apiserver HA
        run: |
          gh workflow run k8s-kind-network-e2e.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger K8s Network Policy E2E tests
        run: |
          gh workflow run k8s-kind-network-policies-e2e.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
